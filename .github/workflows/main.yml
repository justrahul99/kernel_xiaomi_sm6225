name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev zip curl git libncurses-dev pkg-config perl kmod e2fsprogs

      # Python Requirement Bypass Fix
      - name: Bypassing Python Requirement
        run: |
          sudo bash -c 'cat << "EOF" > /usr/local/bin/python2
          #!/bin/sh
          echo "2.7.18"
          EOF'
          sudo chmod +x /usr/local/bin/python2
          sudo ln -sf /usr/local/bin/python2 /usr/bin/python2
          sudo ln -sf /usr/local/bin/python2 /usr/bin/python

      - name: Clone Azure Clang Toolchain
        run: |
          git clone https://gitlab.com/Panchajanya1999/azure-clang --depth=1 clang

      - name: Set up MemKernel as a module
        run: |
          curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_DIR="$(pwd)/clang"

          make O=out vendor/fog-perf_defconfig

          make -j$(nproc --all) O=out \
               CC=${CLANG_DIR}/bin/clang \
               LD=${CLANG_DIR}/bin/ld.lld \
               AR=${CLANG_DIR}/bin/llvm-ar \
               NM=${CLANG_DIR}/bin/llvm-nm \
               OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy \
               OBJDUMP=${CLANG_DIR}/bin/llvm-objdump \
               STRIP=${CLANG_DIR}/bin/llvm-strip \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel and Module Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fog-Kernel-with-MemKernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/drivers/memkernel/memkernel.ko
          if-no-files-found: warn
