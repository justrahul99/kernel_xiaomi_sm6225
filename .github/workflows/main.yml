name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: gcc/12
        defconfig: vendor/fog-perf_defconfig
        image: Image.gz-dtb

    - name: Prepare Artifacts
      run: |
        mkdir -p output_files
        
        # ১. বিল্ড অ্যাকশনের নিজস্ব আউটপুট থেকে ফাইল কপি
        if [ -n "${{ steps.build.outputs.outfile }}" ] && [ -f "${{ steps.build.outputs.outfile }}" ]; then
          cp "${{ steps.build.outputs.outfile }}" output_files/
        fi

        # ২. কার্নেল ইমেজ যদি নির্দিষ্ট পাথে থাকে
        find . -name "Image.gz-dtb" -exec cp {} output_files/ \; 2>/dev/null || true

        # ৩. MemKernel ড্রাইভার মডিউল কপি
        find . -name "memkernel.ko" -exec cp {} output_files/ \; 2>/dev/null || true

        # কন্টেন চেক
        ls -la output_files/

    - name: Upload Kernel Image and Module
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-and-Module-Files
        path: output_files/
