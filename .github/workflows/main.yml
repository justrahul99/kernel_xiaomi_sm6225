name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: gcc/12
        defconfig: vendor/fog-perf_defconfig
        image: Image.gz-dtb

    - name: Find and Copy Built Files
      run: |
        mkdir -p output_files

        echo "=== Output from build action ==="
        echo "Outfile step output: ${{ steps.build.outputs.outfile }}"

        echo "=== Searching for Image files ==="
        find . -type f \( -name "Image*" -o -name "*.ko" \)

        # ফাইল কপি করা
        find . -type f \( -name "Image*" -o -name "*.ko" \) -exec cp {} output_files/ \; 2>/dev/null || true

        echo "=== Files copied to output_files ==="
        ls -la output_files/

    - name: Upload Kernel Image and Module
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-and-Module-Files
        path: output_files/
        if-no-files-found: warn
